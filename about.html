<!DOCTYPE html>
<html lang="en" class="booting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rhysend Digital</title>
  <meta name="description" content="">
  <link rel="icon" href="images/rhysend-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@400;600&family=IBM+Plex+Sans+TC:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=15">
  <noscript><style>html.booting body { visibility: visible; }</style></noscript>
</head>
<body data-page="firm">
  <a class="skip" href="#main" data-i18n="skip"></a>
  <header class="mast">
    <a class="brand" href="index.html">
      <img class="logo" src="images/rhysend-logo.svg" alt="Rhysend Digital Limited, 昇韻數科有限公司" width="960" height="416">
    </a>
    <nav class="pages" aria-label="Sheets" data-i18n-aria="navLabel">
      <a href="index.html" data-i18n="navSolutions"></a>
      <a href="about.html" aria-current="page" data-i18n="navFirm"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language" data-i18n-aria="langLabel">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh-Hant" aria-pressed="false">繁</button>
      <button type="button" data-lang="zh-Hans" aria-pressed="false">简</button>
    </div>
  </header>
  <main class="wrap" id="main">
    <section class="block">
      <h1 data-i18n="firmTitle"></h1>
      <div class="intro">
        <p data-i18n="firmLead"></p>
        <p data-i18n="firmBody"></p>
      </div>
    </section>
    <section class="block">
      <h2 data-i18n="partnerTitle"></h2>
      <ul class="partners" data-partners></ul>
    </section>
    <section class="block">
      <h2 data-i18n="contact"></h2>
      <ul class="facts">
        <li data-fact="email" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M4 7l8 6 8-6"/></svg>
          <a data-fact-value href=""></a>
        </li>
        <li data-fact="phone" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h3l1.5 4-2 1.2a12 12 0 0 0 5.3 5.3L16 12l4 1.5V17a2 2 0 0 1-2 2A14 14 0 0 1 5 5a2 2 0 0 1 2-2z"/></svg>
          <a data-fact-value href=""></a>
        </li>
        <li data-fact="registration" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
          <span data-fact-value></span>
        </li>
      </ul>
    </section>
    <section class="block">
      <form class="note" action="#">
        <h2 id="send-title" data-i18n="send"></h2>
        <label class="field">
          <textarea name="note" data-i18n-placeholder="placeholder" placeholder="" aria-labelledby="send-title"></textarea>
        </label>
        <button type="submit" data-i18n="button"></button>
        <p class="status" data-status role="status"></p>
      </form>
    </section>
  </main>
  <footer class="colophon">
    <p data-i18n="back"></p>
    <p data-i18n="rights"></p>
  </footer>
  <script type="module" src="js/site.js?v=16"></script>
</body>
</html>
